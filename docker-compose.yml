version: '3.8'

# Single app container = dashboard backend (SSR + server functions) + frontend.
# It talks to Redis directly; no separate backend service needed.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-cleosecret}
      - REDIS_DB=0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cleo-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-cleosecret}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - cleo-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cleosecret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  cleo-network:
    driver: bridge
volumes:
  redis-data:
    name: cleo-redis-data
